[project]
name = "mcp-urdu-toolkit"
version = "0.1.0"
description = "MCP server with Pakistan/Urdu helpers: phone numbers, Urdu digits, Hijri dates, lakh/crore formatting"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Sameer Hussain" }]
dependencies = ["mcp>=2.0,<3"]

[project.scripts]
mcp-urdu-toolkit = "mcp_urdu_toolkit.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_urdu_toolkit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
